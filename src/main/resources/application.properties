server.port=0

# 敏感操作临时锁定（独立于普通限流）
# 连续失败次数阈值；锁定时长；失败计数窗口
guard.sensitive-lock.failure-threshold=${GUARD_SENSITIVE_LOCK_THRESHOLD:3}
guard.sensitive-lock.lock-duration-seconds=${GUARD_SENSITIVE_LOCK_DURATION:300}
guard.sensitive-lock.failure-window-seconds=${GUARD_SENSITIVE_LOCK_WINDOW:300}

# 普通限流与登录锁定
guard.ratelimit.window-seconds=${GUARD_RATELIMIT_WINDOW:60}
guard.ratelimit.max-attempts-per-window=${GUARD_RATELIMIT_MAX:20}
guard.ratelimit.lock-threshold=${GUARD_LOGIN_LOCK_THRESHOLD:5}
guard.ratelimit.lock-duration-seconds=${GUARD_LOGIN_LOCK_DURATION:60}

# 凭据有效期：access TTL；refresh TTL 默认为 access 的两倍（在 TokenService 内派生）
guard.token.ttl-seconds=${GUARD_TOKEN_TTL:1800}
guard.session.ttl-seconds=${GUARD_SESSION_TTL:1800}
